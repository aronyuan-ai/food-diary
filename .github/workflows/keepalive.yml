# 每 3 天輕量查詢一次 Supabase，避免免費專案因 7 天沒使用而被暫停
name: keep-supabase-awake
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "https://uwxxhbzxrgwvdcqmohzu.supabase.co/rest/v1/stores?select=id&limit=1" \
            -H "apikey: sb_publishable_Yp4tKtKRp3Flor10ykXE7Q_OaBbRdZL" -o /dev/null -w "%{http_code}\n"
